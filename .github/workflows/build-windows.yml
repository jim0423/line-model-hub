name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/line-hub-core -> target
            crates/line-hub-mcp -> target
            crates/line-hub-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Run Rust unit tests
        run: cargo test -p line-hub-core --release

      - name: Type-check frontend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build Tauri release
        run: cargo tauri build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: List built artefacts
        shell: bash
        run: |
          echo "==="
          ls -la target/release/line-model-hub.exe 2>/dev/null || echo "exe missing"
          echo "==="
          find target/release/bundle -type f \( -name "*.msi" -o -name "*-setup.exe" \) -exec ls -la {} +

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: line-model-hub-windows
          path: |
            target/release/line-model-hub.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/line-model-hub.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: true