name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/line-hub-core -> target
            crates/line-hub-mcp -> target
            crates/line-hub-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Run Rust unit tests
        run: cargo test -p line-hub-core --release

      - name: Type-check frontend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build Tauri release
        run: cargo tauri build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Verify bundled resources landed in installer
        # v0.6.7: catch the class of bug where tauri-bundler succeeds but
        # silently skips resources whose NSIS File directive path doesn't
        # resolve under target/release/nsis/<arch>/. We grep the final
        # installer binary for the marker strings. Zero matches means the
        # bundler silently dropped the resource even though the build
        # succeeded.
        shell: bash
        run: |
          set -euo pipefail
          INSTALLER="$(find target/release/bundle/nsis -name '*-setup.exe' -print -quit)"
          if [[ -z "${INSTALLER}" ]]; then
            echo "FAIL: no installer found under target/release/bundle/nsis/"
            exit 1
          fi
          echo "checking ${INSTALLER}"
          for marker in line-desktop-mcp server.js package.json npm-shrinkwrap.json; do
            count=$(grep -c -- "${marker}" "${INSTALLER}" || true)
            echo "  ${marker}: ${count} occurrences"
            if [[ "${count}" == "0" ]]; then
              echo "FAIL: '${marker}' not bundled in installer — tauri-bundler silently skipped a File directive"
              exit 1
            fi
          done
          echo "OK: installer contains all expected bundle.resources markers"

      - name: List built artefacts
        shell: bash
        run: |
          echo "==="
          ls -la target/release/line-model-hub.exe 2>/dev/null || echo "exe missing"
          echo "==="
          find target/release/bundle -type f \( -name "*.msi" -o -name "*-setup.exe" \) -exec ls -la {} +

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: line-model-hub-windows
          path: |
            target/release/line-model-hub.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Attach to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/line-model-hub.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: false