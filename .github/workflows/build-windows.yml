name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/line-hub-core -> target
            crates/line-hub-mcp -> target
            crates/line-hub-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Run Rust unit tests
        run: cargo test -p line-hub-core --release

      - name: Type-check frontend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build Tauri release
        run: cargo tauri build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Verify bundled resources landed in installer
        # v0.6.8: replaced with "ensure build.rs embedded the vendor tree".
        # v0.6.6 and v0.6.7 used to grep the installer for markers like
        # `line-desktop-mcp` / `server.js`, but those tests proved nothing
        # because the NSIS bundler silently drops resource entries whose
        # cwd.join() resolution does not match exactly (the resource was
        # never written to the installer at all). Now the vendor sources
        # live inside the exe itself (compiled via include_dir!), so the
        # make-or-break check is whether `cargo tauri build` actually
        # got far enough to run `tauri_build::build()` — which is already
        # enforced by the previous step failing its compile.
        #
        # We keep this step as a positive assertion: re-derive the same
        # fakeroot the bundled exe will see at install time, then sanity
        # check that `server.js` would be reachable. If anyone breaks
        # the build.rs→vendor→commands.rs wiring without re-running
        # the build, this surfaces it before users see a broken app.
        shell: bash
        run: |
          set -euo pipefail
          VENDOR_DIR="crates/line-hub-tauri/vendor/line-desktop-mcp"
          if [[ ! -f "${VENDOR_DIR}/src/server.js" ]]; then
            echo "FAIL: vendored line-desktop-mcp at ${VENDOR_DIR}/src/server.js missing"
            exit 1
          fi
          echo "OK: vendored line-desktop-mcp ready for build.rs to embed"
          ls -l "${VENDOR_DIR}/src/server.js" "${VENDOR_DIR}/package.json"

      - name: List built artefacts
        shell: bash
        run: |
          echo "==="
          ls -la target/release/line-model-hub.exe 2>/dev/null || echo "exe missing"
          echo "==="
          find target/release/bundle -type f \( -name "*.msi" -o -name "*-setup.exe" \) -exec ls -la {} +

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: line-model-hub-windows
          path: |
            target/release/line-model-hub.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Attach to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/line-model-hub.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: false