[workspace]
resolver = "2"
members = [
    "crates/line-hub-core",
    "crates/line-hub-mcp",
    "crates/line-hub-tauri",
]

[workspace.package]
version = "0.6.10"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Jim <jim@tt-openclaw>"]
repository = "https://github.com/jim/line-model-hub"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# HTTP / streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
reqwest-eventsource = "0.6"
eventsource-stream = "0.2"
bytes = "1.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

# Error / logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Crypto for API key encryption
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
aes-gcm = "0.10"

# Resolving user data dir for the embedded line-desktop-mcp vendor tree
dirs = "5"

# Local persistence
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# MCP protocol (JSON-RPC)
jsonrpc-core = "18.0"

# v0.6.8: bundles line-desktop-mcp directly into the line-model-hub.exe
# so we no longer depend on the Tauri NSIS bundler picking up resource
# paths correctly (see CHANGELOG v0.6.6..v0.6.7 — silent skip issue).
include_dir = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
debug = true