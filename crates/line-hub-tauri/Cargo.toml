[package]
name = "line-hub-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 desktop shell for Line 小幫手"

[lib]
name = "line_hub_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "line-model-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# v0.6.8: embed the vendored line-desktop-mcp sources into the exe at
# compile time (see src/build.rs). The runtime `vendor` module unpacks
# them to ~/.line-hub/vendor/line-desktop-mcp/ on first launch and runs
# `npm install` there.
include_dir.workspace = true

[dependencies]
line-hub-core = { path = "../line-hub-core" }
line-hub-mcp = { path = "../line-hub-mcp" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
chrono.workspace = true
base64 = "0.22"
include_dir.workspace = true
dirs = "5"

# Tauri 2.x
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tracing-subscriber.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]